# /etc/rsyslog.d/10-pfsense.conf on lab-wazuh (10.10.30.10)
#
# rsyslog relay between pfSense and Wazuh.
# - Accepts syslog on UDP 514, only from pfSense's SECURITY address (10.10.30.1).
# - Suricata EVE JSON lines -> /var/log/suricata-eve.json (bare JSON, read by Wazuh as json)
# - Everything else (firewall/system events) -> /var/log/pfsense.log with the
#   hostname "pfSense" added, because pfSense's BSD (RFC 3164) syslog omits it.
#
# Validate before restarting:  sudo rsyslogd -N1
# Then:                        sudo systemctl restart rsyslog

module(load="imudp")
template(name="PfFormat" type="string" string="%timereported% pfSense %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")
template(name="EveJson" type="string" string="%$.eve:::drop-last-lf%\n")
ruleset(name="pfsense") {
        if $fromhost-ip == "10.10.30.1" then {
                set $.eve = ltrim($msg);
                if $programname == "suricata" and $.eve startswith "{" then {
                        action(type="omfile" file="/var/log/suricata-eve.json" template="EveJson")
                        stop
                }
                action(type="omfile" file="/var/log/pfsense.log" template="PfFormat")
        }
}
input(type="imudp" port="514" address="10.10.30.10" ruleset="pfsense")
